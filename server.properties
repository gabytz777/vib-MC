#vib-MC server properties
#Tue Jul 28 21:26:46 EEST 2026
allow-end=true
allow-flight=false
allow-nether=true
difficulty=easy
generate-structures=true
level-name=world
level-type=default
max-build-height=320
max-players=20
max-tick-time=60000
motd=A vib-MC Server
#Verify players with Mojang's session servers. Required for real skins and real UUIDs.
#Turn off only for a LAN/offline server, or when behind a proxy that authenticates for you.
online-mode=true
#Proxy forwarding: none, or legacy (BungeeCord, or Velocity with
#player-info-forwarding-mode = "legacy"). Velocity's modern forwarding cannot work here:
#its Login Plugin Request packet does not exist in protocol 340.
proxy-mode=none
#Only accept proxy-forwarded logins from this address. Blank allows any source, which is
#only safe when this port is firewalled to the proxy.
proxy-trusted-address=127.0.0.1
pvp=true
#Blank rolls a random seed for a new world. A number is used as-is; any other text is
#hashed deterministically. Once a world exists its level.dat seed wins, and this file is
#never rewritten.
seed=
#How often the world autosaves, in ticks (20 ticks = 1 second). 0 disables autosaving.
autosave-interval-ticks=6000
#Whether to save the world when the server stops.
save-on-stop=true
#Shown to players when the server shuts down.
shutdown-message=Server closed
server-ip=0.0.0.0
server-port=25565
simulation-distance=8
spawn-animals=true
spawn-monsters=true
view-distance=4
#Skin applied to all players. MUST be a direct PNG url (e.g. textures.minecraft.net/texture/...).
#Short links like mineskin.org/minesk.in pages do NOT work - the client loads the url as an image.
#Per-player override: skin-url.<username>=<url>
skin-url=https://textures.minecraft.net/texture/59f3329902e438a47ee59f1042668a0f1ae4b4f7045dc320e523d3458504109d

skin-plugin-enabled=true