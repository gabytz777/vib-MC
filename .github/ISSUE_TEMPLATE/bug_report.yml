name: Bug report
description: Report a bug in vib-MC
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: short
    attributes:
      label: The issue in one short sentence
      placeholder: "e.g. server crashes when I run /give"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's the issue?
      placeholder: What you saw, what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How did it occur?
      description: Steps so we can replicate it.
      placeholder: "1. started the server\n2. ran /give\n3. crash"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: e.g. v0.0.2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Server log output
      description: Paste the raw log output from the server console (not a file name or link).
      placeholder: |
        [12:34:56] [Server thread/INFO]: Starting minecraft server...
        [12:34:56] [Server thread/ERROR]: Crash! it broke
