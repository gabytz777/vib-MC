name: Bug report
description: Something is broken in vib-MC
labels: bug

body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear description of what's broken.
      placeholder: what you saw, what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How did it occur?
      description: Steps to reproduce the issue.
      placeholder: steps so we can replicate it
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Release version
      description: Which vib-MC release are you on?
      placeholder: v0.0.4-hotfix.1
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: Paste the relevant log output here.
      placeholder: paste the raw log output from the server console
      render: shell
    validations:
      required: false