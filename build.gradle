plugins {
    id 'java'
    id 'application'
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    // Targeting 8 is deliberate (the release still runs on Java 8); silence javac's
    // "source/target value 8 is obsolete" notice so real warnings stay visible.
    options.compilerArgs << '-Xlint:-options'
}

application {
    mainClass = 'net.vibmc.server.VibMC'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'net.vibmc.server.VibMC',
            'Implementation-Title': 'vib-MC',
            'Implementation-Version': '0.0.6'
        )
    }
    archiveBaseName = 'vib-mc'
    archiveVersion = ''
}
